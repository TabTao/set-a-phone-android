name: 构建 Android APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 35 构建组件
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: 配置 Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
          cache-provider: basic

      - name: 运行单元测试并构建 Debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: 在 Android 模拟器启动验证
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.setaphone.remote/.MainActivity
            sleep 8
            adb logcat -d
            test -n "$(adb shell pidof com.setaphone.remote)"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: set-a-phone-android-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
